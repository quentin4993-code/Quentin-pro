<!doctype html><html><head><meta charset="utf8"><style>
@font-face{font-family:M;src:url(file:///home/claude/quentin-pro/public/fonts/montserrat-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:M;src:url(file:///home/claude/quentin-pro/public/fonts/montserrat-latin-900-normal.woff2);font-weight:900}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
#root{position:absolute;inset:0}
.box{position:absolute;left:50%;padding:10px 26px;border-radius:18px;font-family:M;font-weight:900;line-height:1.05;text-align:center;white-space:nowrap}
</style></head><body><div id="root"></div><script>
const fps=30, Y="#FFD60A";
// ressort façon Remotion (simulation pas à pas)
function spring(frame,{damping=10,stiffness=100,mass=1}={}){
  if(frame<=0) return 0; let x=0,v=0; const n=Math.round(frame*8), dt=1/fps/8;
  for(let i=0;i<n;i++){const a=(-stiffness*(x-1)-damping*v)/mass; v+=a*dt; x+=v*dt;} return x;}
const lerp=(t,a,b,c,d)=>{const k=Math.min(1,Math.max(0,(t-a)/(b-a)));return c+(d-c)*k};
let T=null;
function render(frame){
  const r=document.getElementById('root'); let h='';
  const H=T.hook;
  if(frame<H.frames){ // ---- HOOK (même animation que le Jour 3)
    const f=frame, out=lerp(f,H.frames-5,H.frames,1,0), wig=Math.sin(f/3)*1.2;
    const imp=Math.max(0,1-Math.abs(f-9)/5), sx=Math.sin(f*3)*10*imp;
    const s1=spring(f,{damping:10,stiffness:220,mass:.7}), s2=spring(f-5,{damping:10,stiffness:220,mass:.7}), s3=spring(f-14,{damping:14});
    const top=H.top;
    h+=`<div style="position:absolute;inset:0;opacity:${out};transform:translateX(${sx}px)">
     <div class=box style="top:${top}px;font-size:64px;color:#000;background:#fff;transform:translateX(-50%) scale(${lerp(s1,0,1,1.6,1)})">${H.a}</div>
     <div class=box style="top:${top+83}px;font-size:102px;color:#000;background:${Y};opacity:${f>=5?1:0};transform:translateX(-50%) scale(${lerp(s2,0,1,2.2,1)}) rotate(${-2+wig}deg)">${H.b}</div>
     <div class=box style="top:${top+245}px;font-size:46px;font-weight:800;color:#fff;background:rgba(0,0,0,.7);opacity:${s3};transform:translateX(-50%) translateY(${lerp(s3,0,1,40,0)}px)">${H.c}</div></div>`;
  }
  for(const L of T.labels){ // ---- NOM DE L'ÉTIREMENT + TEMPS
    if(frame<L.start||frame>=L.end) continue;
    const f=frame-L.start, d=L.end-L.start, out=lerp(f,d-4,d,1,0);
    const s1=spring(f,{damping:11,stiffness:240,mass:.7}), s2=spring(f-4,{damping:12,stiffness:220,mass:.7});
    h+=`<div style="position:absolute;inset:0;opacity:${out}">
     <div class=box style="top:250px;font-size:${L.name.length>16?66:84}px;color:#000;background:#fff;transform:translateX(-50%) scale(${lerp(s1,0,1,1.5,1)})">${L.name}</div>
     <div class=box style="top:368px;font-size:58px;color:#000;background:${Y};opacity:${s2>0.01?1:0};transform:translateX(-50%) scale(${lerp(s2,0,1,1.8,1)}) rotate(-2deg)">⏱ ${L.time}</div></div>`;
  }
  const C=T.cta; // ---- FIN « Abonne-toi » + flèche
  if(frame>=C.start){
    const f=frame-C.start, pop=spring(f,{damping:9,stiffness:200}), pulse=f>15?1+Math.max(0,Math.sin((f-15)/4))*.05:1, ar=Math.abs(Math.sin(f/5))*22;
    h+=`<div style="position:absolute;left:0;right:0;bottom:300px;display:flex;flex-direction:column;align-items:center">
     <div style="font-family:M;font-weight:900;font-size:58px;color:#000;background:${Y};padding:16px 34px;border-radius:20px;text-align:center;max-width:880px;transform:scale(${pop*pulse}) rotate(-2deg);box-shadow:0 12px 40px rgba(0,0,0,.45)">${C.text}</div>
     <div style="margin-top:18px;font-family:"DejaVu Sans";font-weight:900;font-size:90px;color:#fff;-webkit-text-stroke:8px #000;paint-order:stroke fill;opacity:${Math.min(1,pop)};transform:translateY(${ar}px)">↓</div></div>`;
  }
  r.innerHTML=h;
}
</script></body></html>
